<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Catalog</title>
  <style>
    :root {
      --bg: #121212;
      --bg-top: #000000;
      --elevated: #181818;
      --elevated-hover: #282828;
      --pill: #242424;
      --pill-hover: #2a2a2a;
      --text: #ffffff;
      --text-sub: #b3b3b3;
      --green: #1db954;
      --green-hover: #1ed760;
      --shadow: 0 8px 24px rgba(0,0,0,.5);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Top bar ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      background: rgba(0,0,0,.85);
      backdrop-filter: saturate(160%) blur(6px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
      white-space: nowrap;
    }
    .brand .dot {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--green);
      display: grid; place-items: center;
      font-size: 16px;
    }

    .search {
      position: relative;
      flex: 1;
      max-width: 460px;
    }
    .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: .7; }
    #filterInput {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: var(--pill);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: background .2s, border-color .2s;
    }
    #filterInput::placeholder { color: #a0a0a0; }
    #filterInput:hover { background: var(--pill-hover); }
    #filterInput:focus { border-color: #fff; background: var(--pill-hover); }

    .actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
    .btn {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-sub);
      background: transparent;
      transition: transform .1s, color .2s, background .2s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      font-family: inherit;
    }
    .btn:hover { color: #fff; transform: scale(1.04); text-decoration: none; }
    .btn.primary {
      background: var(--green);
      color: #000;
      padding: 10px 20px;
    }
    .btn.primary:hover { background: var(--green-hover); transform: scale(1.04); }

    /* ---------- Content ---------- */
    .content { padding: 8px 24px 120px; }
    .heading {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin: 20px 4px 6px;
    }
    .heading h1 { font-size: 26px; margin: 0; letter-spacing: -.01em; }
    .count { color: var(--text-sub); font-size: 14px; }

    #status {
      min-height: 20px;
      margin: 6px 4px 14px;
      font-size: 13px;
      color: var(--text-sub);
    }
    #status.error { color: #f2545b; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 20px;
    }

    .card {
      position: relative;
      background: var(--elevated);
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      transition: background .3s ease;
    }
    .card:hover { background: var(--elevated-hover); }

    .art-wrap { position: relative; margin-bottom: 14px; }
    .art {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      object-fit: cover;
      display: block;
      box-shadow: var(--shadow);
      background: #333;
    }
    .art.placeholder {
      display: grid;
      place-items: center;
      font-size: 42px;
      background: linear-gradient(135deg, #3a3a3a, #1f1f1f);
      color: #6a6a6a;
    }

    /* Green play button that rises on hover, Spotify-style */
    .play {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--green);
      color: #000;
      display: grid; place-items: center;
      box-shadow: 0 8px 16px rgba(0,0,0,.5);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .3s, transform .3s, background .2s;
      pointer-events: none;
    }
    .card:hover .play { opacity: 1; transform: translateY(0); }

    .card .title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card .artist {
      margin-top: 6px;
      font-size: 13px;
      color: var(--text-sub);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .badge {
      position: absolute;
      top: 22px; left: 22px;
      z-index: 2;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      background: #f5a623;
      color: #000;
      border-radius: 4px;
      padding: 3px 7px;
    }

    .card.flash { animation: flash 1.3s ease-out; }
    @keyframes flash {
      0%   { box-shadow: 0 0 0 2px var(--green-hover) inset; background: #1e3a26; }
      100% { box-shadow: none; background: var(--elevated); }
    }

    .empty { color: var(--text-sub); padding: 40px 4px; font-size: 15px; }

    /* ---------- Modal (Now Spinning) ---------- */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }
    .modal-content {
      background: linear-gradient(180deg, #2a2a2a 0%, #181818 100%);
      border-radius: 12px;
      padding: 28px;
      text-align: center;
      width: 340px;
      max-width: 100%;
      box-shadow: 0 24px 60px rgba(0,0,0,.6);
    }
    .modal-content .eyebrow {
      text-transform: uppercase;
      letter-spacing: .12em;
      font-size: 11px;
      font-weight: 800;
      color: var(--green-hover);
      margin-bottom: 18px;
    }
    #modalImg {
      width: 220px; height: 220px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: var(--shadow);
      background: #333;
      margin: 0 auto 18px;
      display: block;
    }
    #modalTitle { font-size: 20px; font-weight: 800; line-height: 1.25; }
    #modalArtist { color: var(--text-sub); margin-top: 6px; font-size: 14px; }
    .modal-content .btn { margin-top: 22px; }

    .tracks { margin-top: 16px; text-align: left; max-height: 240px; overflow-y: auto; }
    .tracks .t-status { color: var(--text-sub); font-size: 13px; text-align: center; padding: 8px 0; }
    .tracks ol { margin: 0; padding: 0; list-style: none; }
    .tracks li {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 7px 4px; font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .tracks li .tt { color: #eee; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tracks li .tl { color: var(--text-sub); flex: none; font-variant-numeric: tabular-nums; }
    .tracks .disc {
      color: var(--green-hover); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em; margin: 12px 0 4px;
    }

    @media (max-width: 640px) {
      /* Brand + actions on the first row, collection search full-width below. */
      .topbar { flex-wrap: wrap; gap: 8px; padding: 12px; }
      .brand { font-size: 20px; }
      .brand .dot { width: 30px; height: 30px; font-size: 16px; }
      .search { order: 3; max-width: none; flex-basis: 100%; }
      .actions { gap: 6px; }
      .btn { padding: 8px 12px; font-size: 13px; }
      .btn.primary { padding: 8px 14px; }

      /* Denser grid: ~3 albums per row instead of one. */
      .content { padding: 4px 12px 96px; }
      .heading { margin: 12px 4px 2px; gap: 8px; }
      .heading h1 { font-size: 20px; }
      #status { margin: 4px 4px 10px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }
      .card { padding: 8px; border-radius: 6px; }
      .art-wrap { margin-bottom: 8px; }
      .card .title { font-size: 12px; }
      .card .artist { font-size: 11px; margin-top: 2px; }
      .play { width: 34px; height: 34px; right: 6px; bottom: 6px; }
      .badge { top: 13px; left: 13px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot">🎵</span> Music Catalog</div>

    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="filterInput" autofocus placeholder="Search your collection…" />
    </div>

    <div class="actions">
      <button class="btn primary" id="dieRollBtn">🎲 Die Roll</button>
      <a class="btn" href="/add.html">➕ Add by name</a>
      <button class="btn" id="reloadBtn">↻ Reload</button>
      <button class="btn" id="exportBtn">Download backup</button>
    </div>
  </div>

  <div class="content">
    <div class="heading">
      <h1>Your Collection</h1>
      <span class="count" id="count"></span>
    </div>
    <div id="status"></div>
    <div id="results" class="grid"></div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="eyebrow">Next Up</div>
      <img id="modalImg" />
      <div id="modalTitle"></div>
      <div id="modalArtist"></div>
      <div id="modalTracks" class="tracks"></div>
      <button class="btn primary" onclick="closeModal()">Close</button>
    </div>
  </div>

<script>
const CSV_FILE = "VinylScans.csv";

// collection = rows loaded from VinylScans.csv (the source of truth).
let collection = [];
// Flat list of what's currently rendered (after filtering), for click -> modal.
let rendered = [];
let filterQuery = "";

const filterInput = document.getElementById("filterInput");
const resultsDiv = document.getElementById("results");
const statusDiv = document.getElementById("status");
const countDiv = document.getElementById("count");

// Live-filter the collection as you type.
filterInput.addEventListener("input", (e) => {
  filterQuery = e.target.value.trim().toLowerCase();
  render();
});

loadCollection();

// ---------- CSV loading ----------

async function loadCollection() {
  setStatus("Loading " + CSV_FILE + "…");
  try {
    const res = await fetch(CSV_FILE, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    collection = parseCsv(text);
    setStatus("");
    render();
  } catch (err) {
    console.error(err);
    collection = [];
    render();
    setStatus(
      "Could not load " + CSV_FILE + " (" + err.message + "). " +
      "Open this page through the server: run  node server.js  in this folder, " +
      "then visit http://localhost:8000/",
      true
    );
  }
}

// Minimal RFC-4180-ish CSV parser: handles quoted fields, embedded commas,
// escaped "" quotes, and CRLF/LF line endings. Assumes columns:
// Barcode,Title,Artist,Image (header row skipped).
function parseCsv(text) {
  const rows = [];
  let field = "";
  let record = [];
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ",") {
      record.push(field); field = "";
    } else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      record.push(field); field = "";
      if (record.length > 1 || record[0] !== "") rows.push(record);
      record = [];
    } else {
      field += c;
    }
  }
  // last field / record if no trailing newline
  if (field !== "" || record.length) {
    record.push(field);
    if (record.length > 1 || record[0] !== "") rows.push(record);
  }

  if (!rows.length) return [];
  // Drop header if present.
  if (String(rows[0][0]).trim().toLowerCase() === "barcode") rows.shift();

  return rows.map(r => ({
    code: (r[0] || "").trim(),
    title: (r[1] || "").trim(),
    artist: (r[2] || "").trim(),
    image: (r[3] || "").trim()
  }));
}

// ---------- Rendering ----------

const PLAY_ICON =
  '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

// Route remote covers through the server's local cache; leave local paths as-is.
function coverUrl(src) {
  if (!src) return "";
  return /^https?:\/\//i.test(src) ? "/cover?src=" + encodeURIComponent(src) : src;
}

function cardHtml(p, index) {
  const art = p.image
    ? `<img class="art" src="${escapeHtml(coverUrl(p.image))}" alt="" loading="lazy"
          onerror="this.classList.add('placeholder');this.removeAttribute('src');this.textContent='🎵';">`
    : `<div class="art placeholder">🎵</div>`;
  return `
    <div class="card" data-code="${escapeHtml(p.code)}" data-index="${index}" onclick="openAlbum(${index})">
      <div class="art-wrap">
        ${art}
        <div class="play">${PLAY_ICON}</div>
      </div>
      <div class="title">${escapeHtml(p.title)}</div>
      <div class="artist">${escapeHtml(p.artist || "—")}</div>
    </div>`;
}

function render() {
  rendered = filterQuery
    ? collection.filter(p =>
        (p.title + " " + p.artist + " " + p.code).toLowerCase().includes(filterQuery))
    : collection;

  if (!collection.length) {
    resultsDiv.innerHTML =
      '<div class="empty">No albums yet. Use <a href="/add.html">Add</a> to build your collection.</div>';
  } else if (!rendered.length) {
    resultsDiv.innerHTML =
      '<div class="empty">No albums match “' + escapeHtml(filterQuery) + '”.</div>';
  } else {
    resultsDiv.innerHTML = rendered.map((p, i) => cardHtml(p, i)).join("");
  }

  const total = collection.length;
  countDiv.textContent = filterQuery
    ? rendered.length + " of " + total + " album" + (total === 1 ? "" : "s")
    : total + " album" + (total === 1 ? "" : "s");
}

function openAlbum(index) {
  const item = rendered[index];
  if (item) showModal(item);
}

function setStatus(msg, isError) {
  statusDiv.textContent = msg || "";
  statusDiv.className = isError ? "error" : "";
}

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// ---------- Modal ----------

function showModal(item) {
  const img = document.getElementById("modalImg");
  if (item.image) { img.src = coverUrl(item.image); img.style.display = "block"; }
  else { img.removeAttribute("src"); img.style.display = "none"; }
  document.getElementById("modalTitle").innerText = item.title;
  document.getElementById("modalArtist").innerText = item.artist || "";
  document.getElementById("modal").style.display = "flex";
  loadTracks(item);
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

// ---------- Tracklist (via MusicBrainz, cached server-side) ----------

let tracksReqId = 0;

async function loadTracks(item) {
  const box = document.getElementById("modalTracks");
  const myReq = ++tracksReqId;
  box.innerHTML = '<div class="t-status">Loading tracks…</div>';

  const params = new URLSearchParams();
  if (item.code) params.set("barcode", item.code);
  if (item.title) params.set("title", item.title);
  if (item.artist && item.artist !== "N/A") params.set("artist", item.artist);

  try {
    const res = await fetch("/api/tracks?" + params.toString());
    const data = await res.json();
    if (myReq !== tracksReqId) return; // a newer modal opened; ignore stale result
    if (!res.ok || !data.found || !data.tracks || !data.tracks.length) {
      box.innerHTML = '<div class="t-status">No tracklist found.</div>';
      return;
    }
    box.innerHTML = renderTracks(data.tracks);
  } catch (err) {
    if (myReq !== tracksReqId) return;
    box.innerHTML = '<div class="t-status">Couldn\'t load tracks.</div>';
  }
}

function fmtLen(ms) {
  if (!ms) return "";
  const s = Math.round(ms / 1000);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function renderTracks(tracks) {
  const multiDisc = tracks.some(t => t.disc && t.disc > 1);
  let html = "";
  let lastDisc = null;
  let open = false;
  tracks.forEach(t => {
    if (multiDisc && t.disc !== lastDisc) {
      if (open) html += "</ol>";
      html += `<div class="disc">Disc ${t.disc}</div><ol>`;
      open = true;
      lastDisc = t.disc;
    } else if (!open) {
      html += "<ol>";
      open = true;
    }
    const num = t.number ? escapeHtml(t.number) + ". " : "";
    html += `<li><span class="tt">${num}${escapeHtml(t.title)}</span>` +
            `<span class="tl">${fmtLen(t.length)}</span></li>`;
  });
  if (open) html += "</ol>";
  return html;
}

// Close modal when clicking the backdrop.
document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") closeModal();
});

// ---------- Buttons ----------

document.getElementById("reloadBtn").onclick = () => loadCollection();

document.getElementById("exportBtn").onclick = () => {
  const all = collection;
  const rows = [["Barcode", "Title", "Artist", "Image"]];
  all.forEach(p => rows.push([p.code, p.title, p.artist, p.image]));

  const csv = rows.map(r => r.map(csvField).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = CSV_FILE;
  a.click();
  URL.revokeObjectURL(url);
  setStatus("Downloaded a backup copy of " + all.length + " rows.");
};

document.getElementById("dieRollBtn").onclick = () => {
  const pool = collection;
  if (!pool.length) return alert("Collection is empty");
  showModal(pool[Math.floor(Math.random() * pool.length)]);
};

// Wrap a value as a CSV field (always quoted, "" for embedded quotes) to
// match the existing VinylScans.csv format.
function csvField(v) {
  return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
}
</script>
</body>
</html>
